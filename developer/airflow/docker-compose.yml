version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION}
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=fbZ1OMwZNo4f9w7EGO66pZllgHWZId6kiZ_06N-q-8g=
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
  volumes:
    - ./data/airflow/dags:/opt/airflow/dags
    - ./data/airflow/logs:/opt/airflow/logs
    - ./data/airflow/plugins:/opt/airflow/plugins
    - ./data/airflow/jobs:/opt/airflow/jobs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT_8080}:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  spark-master:
    image: apache/spark:${SPARK_VERSION}
    user: root
    hostname: spark-master
    environment:
      - SPARK_LOCAL_IP=${SPARK_MASTER_LOCAL_IP}
      - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}
    ports:
      - "${SPARK_PORT_8080}:8080"
      - "${SPARK_PORT_7077}:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    image: apache/spark:${SPARK_VERSION}
    user: root
    hostname: spark-worker
    environment:
      - SPARK_LOCAL_IP=${SPARK_WORKER_LOCAL_IP}
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

volumes:
  airflow_postgres_data:
