services:
  spring-boot-app:
    container_name: spring-boot-app
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - ./target/:/target/
    environment:
      - PORT=8080
  postgres:
    image: postgres:18.2
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: crud
      POSTGRES_USER: cruduser
      POSTGRES_PASSWORD: crudpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
volumes:
  postgresql-datavolume: