services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    container_name: ollama-app
    ports:
      - ${OLLAMA_PORT_11434}:11434
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
      - CUDA_VISIBLE_DEVICES=0
    # GPU reservation is a separate section below.
    # Add it only on hosts that actually have NVIDIA GPUs.      
    volumes:
      - ./data/ollama/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: chroma
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - ./data/chromadb/chroma:/chroma/chroma
  qdrant-vector-db:
    image: qdrant/qdrant:${QDRANT_VERSION} # Official Qdrant Docker Image
    container_name: qdrant-vector-db
    ports:
      - ${QDRANT_PORT_6333}:6333 # API Endpoint for Vector Queries (QDRANT_API_KEY optional)
    environment:
      - PARENT_DIR=/qdrant/storage
    volumes:
      - ./data/qdrant/storage:/qdrant/storage