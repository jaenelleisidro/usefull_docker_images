# Use root/example as user/password credentials
version: '3.1'

services:

  db:
    image: mysql:8.0.33-debian
    container_name: mysql_port3306_container
    hostname: mysql_port3306_host
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: test101
    volumes:
      - mysql-volume:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always     
volumes:
  mysql-volume: