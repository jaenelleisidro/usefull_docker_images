# Use root/test101 as user/password credentials
services:
  db:
    image: mysql:8.0.33-debian
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: test101
    container_name: mysql_port3306_container
    hostname: mysql_port3306l_host
  adminer:
    image: adminer:5.4.2
    restart: always
    ports:
      - 8080:8080
    container_name: phpmyadmin_container
    hostname: phpmyadmin_host
