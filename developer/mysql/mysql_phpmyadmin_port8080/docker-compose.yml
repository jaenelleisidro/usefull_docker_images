# Use root/test101 as user/password credentials
services:
  db:
    image: mysql:8.0.33-debian
    container_name: mysql_phpmyadmin_port3306_container
    hostname: mysql_phpmyadmin_port3306_host
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: test101
    volumes:
      - mysql-volume:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
  adminer:
    image: adminer:5.4.2
    restart: always
    ports:
      - 8080:8080
    container_name: phpmyadmin_container
    hostname: phpmyadmin_host
volumes:
  mysql-volume: